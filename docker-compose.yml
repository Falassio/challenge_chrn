services:
  chiron-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chiron_agent_service
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      - OPENAI_MODEL=${OPENAI_MODEL:-gemini-2.5-flash}
      - DATABASE_URL=sqlite:///./chiron_sessions.db
      - SANDBOX_TIMEOUT_SECONDS=15
      - MAX_ITERATIONS=5
    volumes:
      - ./output/plots:/app/output/plots
      - ./day1/data:/app/day1/data
      - chiron_data:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  chiron_data:
